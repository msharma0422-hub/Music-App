name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project Skeleton
        run: |
          rm -rf *
          flutter create --org com.mymusic . --project-name my_music_app
          flutter pub add youtube_explode_dart just_audio audio_session path_provider http

      - name: Overwrite Android Manifest for Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application
                  android:label="My Music"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Overwrite Main Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:http/http.dart' as http;

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MusicApp());
          }

          class MusicApp extends StatelessWidget {
            const MusicApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'My Music',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  primaryColor: const Color(0xFF1DB954),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFF1DB954),
                    secondary: Color(0xFF1DB954),
                  ),
                ),
                home: const MainNavigationScreen(),
                debugShowCheckedModeBanner: false,
              );
            }
          }

          class SongItem {
            final String id;
            final String title;
            final String artist;
            final String thumbnailUrl;
            final String? localPath;

            SongItem({
              required this.id,
              required this.title,
              required this.artist,
              required this.thumbnailUrl,
              this.localPath,
            });
          }

          class MainNavigationScreen extends StatefulWidget {
            const MainNavigationScreen({super.key});

            @override
            State<MainNavigationScreen> createState() => _MainNavigationScreenState();
          }

          class _MainNavigationScreenState extends State<MainNavigationScreen> {
            int _currentIndex = 0;
            final yt = YoutubeExplode();
            final player = AudioPlayer();
            
            SongItem? currentPlaying;
            bool isBuffering = false;
            
            List<SongItem> trendingSongs = [];
            List<SongItem> searchResults = [];
            List<SongItem> downloadedSongs = [];
            
            bool isLoadingTrending = true;
            bool isSearching = false;
            final TextEditingController _searchController = TextEditingController();

            @override
            void initState() {
              super.initState();
              _loadTrending();
              _loadLocalDownloads();
              
              player.playbackEventStream.listen((event) {}, onError: (e) {
                _showSnack("Error playing track");
              });
            }

            void _showSnack(String msg) {
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(msg)));
            }

            Future<void> _loadTrending() async {
              setState(() => isLoadingTrending = true);
              try {
                final list = await yt.search.search("Latest Hindi Punjabi Songs 2026");
                setState(() {
                  trendingSongs = list.take(25).map((v) => SongItem(
                    id: v.id.value,
                    title: v.title,
                    artist: v.author,
                    thumbnailUrl: v.thumbnails.mediumResUrl,
                  )).toList();
                });
              } catch (e) {
                // fallback
              } finally {
                setState(() => isLoadingTrending = false);
              }
            }

            Future<void> _search(String query) async {
              if (query.trim().isEmpty) return;
              setState(() => isSearching = true);
              try {
                final list = await yt.search.search(query);
                setState(() {
                  searchResults = list.take(30).map((v) => SongItem(
                    id: v.id.value,
                    title: v.title,
                    artist: v.author,
                    thumbnailUrl: v.thumbnails.mediumResUrl,
                  )).toList();
                });
              } catch (e) {
                _showSnack("Search failed. Try again.");
              } finally {
                setState(() => isSearching = false);
              }
            }

            Future<void> _loadLocalDownloads() async {
              try {
                final dir = await getApplicationDocumentsDirectory();
                final files = dir.listSync().whereType<File>().where((f) => f.path.endsWith('.mp3')).toList();
                
                setState(() {
                  downloadedSongs = files.map((f) {
                    final filename = f.path.split('/').last.replaceAll('.mp3', '');
                    final parts = filename.split('---');
                    return SongItem(
                      id: parts.length > 2 ? parts[0] : 'local',
                      title: parts.length > 2 ? parts[1] : filename,
                      artist: parts.length > 2 ? parts[2] : 'Offline',
                      thumbnailUrl: '',
                      localPath: f.path,
                    );
                  }).toList();
                });
              } catch (e) {
                // ignore
              }
            }

            Future<void> _downloadSong(SongItem song) async {
              _showSnack("Downloading: ${song.title}");
              try {
                final manifest = await yt.videos.streamsClient.getManifest(song.id);
                final audioStream = manifest.audioOnly.withHighestBitrate();
                final stream = yt.videos.streamsClient.get(audioStream);
                
                final dir = await getApplicationDocumentsDirectory();
                final cleanTitle = song.title.replaceAll(RegExp(r'[^\w\s]+'), '');
                final cleanArtist = song.artist.replaceAll(RegExp(r'[^\w\s]+'), '');
                final file = File("${dir.path}/${song.id}---$cleanTitle---$cleanArtist.mp3");
                
                final output = file.openWrite();
                await stream.pipe(output);
                await output.flush();
                await output.close();
                
                _showSnack("Downloaded successfully!");
                _loadLocalDownloads();
              } catch (e) {
                _showSnack("Download failed: $e");
              }
            }

            Future<void> _play(SongItem song) async {
              setState(() {
                currentPlaying = song;
                isBuffering = true;
              });

              try {
                if (song.localPath != null && File(song.localPath!).existsSync()) {
                  await player.setFilePath(song.localPath!);
                } else {
                  final manifest = await yt.videos.streamsClient.getManifest(song.id);
                  final audioStream = manifest.audioOnly.withHighestBitrate();
                  await player.setUrl(audioStream.url.toString());
                }
                player.play();
              } catch (e) {
                _showSnack("Playback error");
              } finally {
                setState(() => isBuffering = false);
              }
            }

            @override
            void dispose() {
              yt.close();
              player.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  elevation: 0,
                  backgroundColor: const Color(0xFF1E1E1E),
                  title: const Text('Music Player', style: TextStyle(fontWeight: FontWeight.bold)),
                ),
                body: Stack(
                  children: [
                    IndexedStack(
                      index: _currentIndex,
                      children: [
                        _buildHomeTab(),
                        _buildSearchTab(),
                        _buildDownloadsTab(),
                      ],
                    ),
                    if (currentPlaying != null)
                      Positioned(
                        left: 8,
                        right: 8,
                        bottom: 8,
                        child: _buildMiniPlayer(),
                      ),
                  ],
                ),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  backgroundColor: const Color(0xFF181818),
                  selectedItemColor: const Color(0xFF1DB954),
                  unselectedItemColor: Colors.grey,
                  onTap: (idx) => setState(() => _currentIndex = idx),
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.home_filled), label: 'Home'),
                    BottomNavigationBarItem(icon: Icon(Icons.search), label: 'Search'),
                    BottomNavigationBarItem(icon: Icon(Icons.download_done_rounded), label: 'Downloads'),
                  ],
                ),
              );
            }

            Widget _buildHomeTab() {
              if (isLoadingTrending) {
                return const Center(child: CircularProgressIndicator(color: Color(0xFF1DB954)));
              }
              return RefreshIndicator(
                onRefresh: _loadTrending,
                child: ListView(
                  padding: const EdgeInsets.only(bottom: 90, top: 12),
                  children: [
                    const Padding(
                      padding: EdgeInsets.symmetric(horizontal: 16),
                      child: Text('Trending & New Releases', style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                    ),
                    const SizedBox(height: 12),
                    ListView.builder(
                      shrinkWrap: true,
                      physics: const NeverScrollableScrollPhysics(),
                      itemCount: trendingSongs.length,
                      itemBuilder: (context, i) => _buildSongTile(trendingSongs[i], canDownload: true),
                    ),
                  ],
                ),
              );
            }

            Widget _buildSearchTab() {
              return Column(
                children: [
                  Padding(
                    padding: const EdgeInsets.all(12.0),
                    child: TextField(
                      controller: _searchController,
                      decoration: InputDecoration(
                        hintText: 'Search songs, artists, albums...',
                        filled: true,
                        fillColor: const Color(0xFF282828),
                        prefixIcon: const Icon(Icons.search, color: Colors.white70),
                        suffixIcon: IconButton(
                          icon: const Icon(Icons.clear, color: Colors.white70),
                          onPressed: () {
                            _searchController.clear();
                            setState(() => searchResults.clear());
                          },
                        ),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(25), borderSide: BorderSide.none),
                      ),
                      onSubmitted: _search,
                    ),
                  ),
                  if (isSearching) const LinearProgressIndicator(color: Color(0xFF1DB954)),
                  Expanded(
                    child: ListView.builder(
                      padding: const EdgeInsets.only(bottom: 90),
                      itemCount: searchResults.length,
                      itemBuilder: (context, i) => _buildSongTile(searchResults[i], canDownload: true),
                    ),
                  ),
                ],
              );
            }

            Widget _buildDownloadsTab() {
              return RefreshIndicator(
                onRefresh: _loadLocalDownloads,
                child: downloadedSongs.isEmpty
                    ? const Center(
                        child: Text(
                          'No downloaded songs yet.\nTap the download icon on any song to listen offline!',
                          textAlign: TextAlign.center,
                          style: TextStyle(color: Colors.grey, fontSize: 16),
                        ),
                      )
                    : ListView.builder(
                        padding: const EdgeInsets.only(bottom: 90, top: 12),
                        itemCount: downloadedSongs.length,
                        itemBuilder: (context, i) {
                          final song = downloadedSongs[i];
                          return ListTile(
                            leading: Container(
                              width: 50,
                              height: 50,
                              decoration: BoxDecoration(
                                color: const Color(0xFF282828),
                                borderRadius: BorderRadius.circular(6),
                              ),
                              child: const Icon(Icons.music_note, color: Color(0xFF1DB954)),
                            ),
                            title: Text(song.title, maxLines: 1, overflow: TextOverflow.ellipsis),
                            subtitle: Text(song.artist, maxLines: 1, style: const TextStyle(color: Colors.grey)),
                            trailing: IconButton(
                              icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                              onPressed: () async {
                                if (song.localPath != null) {
                                  File(song.localPath!).deleteSync();
                                  _showSnack("Deleted from downloads");
                                  _loadLocalDownloads();
                                }
                              },
                            ),
                            onTap: () => _play(song),
                          );
                        },
                      ),
              );
            }

            Widget _buildSongTile(SongItem song, {required bool canDownload}) {
              return ListTile(
                leading: ClipRRect(
                  borderRadius: BorderRadius.circular(6),
                  child: song.thumbnailUrl.isNotEmpty
                      ? Image.network(song.thumbnailUrl, width: 52, height: 52, fit: BoxFit.cover)
                      : Container(width: 52, height: 52, color: Colors.grey[800], child: const Icon(Icons.music_note)),
                ),
                title: Text(song.title, maxLines: 1, overflow: TextOverflow.ellipsis),
                subtitle: Text(song.artist, maxLines: 1, style: const TextStyle(color: Colors.grey)),
                trailing: canDownload
                    ? IconButton(
                        icon: const Icon(Icons.arrow_circle_down_rounded, color: Colors.white70),
                        onPressed: () => _downloadSong(song),
                      )
                    : null,
                onTap: () => _play(song),
              );
            }

            Widget _buildMiniPlayer() {
              return GestureDetector(
                onTap: _openFullPlayer,
                child: Container(
                  height: 64,
                  decoration: BoxDecoration(
                    color: const Color(0xFF282828),
                    borderRadius: BorderRadius.circular(10),
                    boxShadow: const [BoxShadow(color: Colors.black54, blurRadius: 8, offset: Offset(0, 4))],
                  ),
                  padding: const EdgeInsets.symmetric(horizontal: 12),
                  child: Row(
                    children: [
                      ClipRRect(
                        borderRadius: BorderRadius.circular(6),
                        child: currentPlaying!.thumbnailUrl.isNotEmpty
                            ? Image.network(currentPlaying!.thumbnailUrl, width: 44, height: 44, fit: BoxFit.cover)
                            : Container(width: 44, height: 44, color: Colors.grey[800], child: const Icon(Icons.music_note)),
                      ),
                      const SizedBox(width: 12),
                      Expanded(
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(currentPlaying!.title, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.w600)),
                            Text(currentPlaying!.artist, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Colors.grey, fontSize: 12)),
                          ],
                        ),
                      ),
                      if (isBuffering)
                        const SizedBox(width: 24, height: 24, child: CircularProgressIndicator(strokeWidth: 2, color: Color(0xFF1DB954)))
                      else
                        StreamBuilder<PlayerState>(
                          stream: player.playerStateStream,
                          builder: (context, snapshot) {
                            final state = snapshot.data;
                    
