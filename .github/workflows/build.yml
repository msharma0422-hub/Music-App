name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project Skeleton
        run: |
          flutter create --org com.mymusic . --project-name my_music_app
          flutter pub add youtube_explode_dart just_audio audio_session

      - name: Overwrite Main Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart';
          import 'package:just_audio/just_audio.dart';

          void main() => runApp(const MusicApp());

          class MusicApp extends StatelessWidget {
            const MusicApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Free Music',
                theme: ThemeData.dark(),
                home: const HomeScreen(),
                debugShowCheckedModeBanner: false,
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final yt = YoutubeExplode();
            final player = AudioPlayer();
            final searchController = TextEditingController();
            List<Video> results = [];
            bool isLoading = false;
            String currentTitle = "No song playing";

            void searchSongs(String query) async {
              setState(() => isLoading = true);
              try {
                final searchList = await yt.search.search(query);
                setState(() => results = searchList.toList());
              } finally {
                setState(() => isLoading = false);
              }
            }

            void playSong(Video video) async {
              setState(() => currentTitle = "Loading: ${video.title}...");
              try {
                final manifest = await yt.videos.streamsClient.getManifest(video.id);
                final audioStream = manifest.audioOnly.withHighestBitrate();
                await player.setUrl(audioStream.url.toString());
                player.play();
                setState(() => currentTitle = video.title);
              } catch (e) {
                setState(() => currentTitle = "Playback Error");
              }
            }

            @override
            void dispose() {
              yt.close();
              player.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Music Player')),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(8.0),
                      child: TextField(
                        controller: searchController,
                        decoration: InputDecoration(
                          hintText: 'Search songs or artist...',
                          suffixIcon: IconButton(
                            icon: const Icon(Icons.search),
                            onPressed: () => searchSongs(searchController.text),
                          ),
                        ),
                        onSubmitted: searchSongs,
                      ),
                    ),
                    if (isLoading) const LinearProgressIndicator(),
                    Expanded(
                      child: ListView.builder(
                        itemCount: results.length,
                        itemBuilder: (context, index) {
                          final song = results[index];
                          return ListTile(
                            leading: Image.network(song.thumbnails.lowResUrl),
                            title: Text(song.title, maxLines: 1),
                            subtitle: Text(song.author),
                            onTap: () => playSong(song),
                          );
                        },
                      ),
                    ),
                    Container(
                      color: Colors.grey[900],
                      padding: const EdgeInsets.all(12),
                      child: Row(
                        children: [
                          Expanded(
                            child: Text(
                              currentTitle,
                              overflow: TextOverflow.ellipsis,
                            ),
                          ),
                          IconButton(
                            icon: Icon(player.playing ? Icons.pause : Icons.play_arrow),
                            onPressed: () {
                              if (player.playing) {
                                player.pause();
                              } else {
                                player.play();
                              }
                              setState(() {});
                            },
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-music-app
          path: build/app/outputs/flutter-apk/app-release.apk
          
